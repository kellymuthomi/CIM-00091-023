<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Medical Management System</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-container {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      width: 300px;
    }

    .login-container h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #0056b3;
    }

    .dashboard {
      display: none;
      padding: 20px;
    }

    nav {
      background: #007bff;
      padding: 10px;
      display: flex;
      gap: 15px;
    }

    nav button {
      background: #0056b3;
      padding: 8px 15px;
    }

    .section {
      display: none;
      margin-top: 20px;
    }

    .section.active {
      display: block;
    }

    .item {
      display: flex;
      justify-content: space-between;
      padding: 8px;
      border-bottom: 1px solid #ddd;
    }
  </style>
</head>
<body>

  <!-- Login Page -->
  <div class="login-container" id="login-container">
    <h2>Admin Login</h2>
    <input type="text" id="username" placeholder="Username" required>
    <input type="password" id="password" placeholder="Password" required>
    <button onclick="login()">Login</button>
  </div>

  <!-- Dashboard -->
  <div class="dashboard" id="dashboard">
    <nav>
      <button onclick="showSection('patients')">Patients</button>
      <button onclick="showSection('doctors')">Doctors</button>
      <button onclick="showSection('medicines')">Medicines</button>
    </nav>

    <!-- Patients Section -->
    <div class="section" id="patients">
      <h2>Manage Patients</h2>
      <form id="patient-form">
        <input type="text" id="patient-name" placeholder="Full Name" required>
        <input type="number" id="patient-age" placeholder="Age" required>
        <input type="text" id="patient-gender" placeholder="Gender" required>
        <button type="submit">Add Patient</button>
      </form>
      <div id="patient-list"></div>
    </div>

    <!-- Doctors Section -->
    <div class="section" id="doctors">
      <h2>Manage Doctors</h2>
      <form id="doctor-form">
        <input type="text" id="doctor-name" placeholder="Doctor Name" required>
        <input type="text" id="doctor-specialty" placeholder="Specialty" required>
        <button type="submit">Add Doctor</button>
      </form>
      <div id="doctor-list"></div>
    </div>

    <!-- Medicines Section -->
    <div class="section" id="medicines">
      <h2>Manage Medicines</h2>
      <form id="medicine-form">
        <input type="text" id="medicine-name" placeholder="Medicine Name" required>
        <input type="text" id="medicine-dosage" placeholder="Dosage" required>
        <button type="submit">Add Medicine</button>
      </form>
      <div id="medicine-list"></div>
    </div>
  </div>

  <script>
    let patients = [];
    let doctors = [];
    let medicines = [];

    function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      if(username === 'kelly' && password === 'admin123') {
        document.getElementById('login-container').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        showSection('patients');
      } else {
        alert('Invalid login credentials!');
      }
    }

    function showSection(sectionId) {
      document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
      document.getElementById(sectionId).classList.add('active');
    }

    // Patient CRUD
    document.getElementById('patient-form').addEventListener('submit', e => {
      e.preventDefault();
      const name = document.getElementById('patient-name').value;
      const age = document.getElementById('patient-age').value;
      const gender = document.getElementById('patient-gender').value;
      const patient = { id: Date.now(), name, age, gender };
      patients.push(patient);
      renderPatients();
      e.target.reset();
    });
    

    function renderPatients() {
      const list = document.getElementById('patient-list');
      list.innerHTML = '';
      patients.forEach(p => {
        list.innerHTML += `<div class='item'><span>${p.name} (${p.age}, ${p.gender})</span></div>`;
      });
    }

    // Doctor CRUD
    document.getElementById('doctor-form').addEventListener('submit', e => {
      e.preventDefault();
      const name = document.getElementById('doctor-name').value;
      const specialty = document.getElementById('doctor-specialty').value;
      const doctor = { id: Date.now(), name, specialty };
      doctors.push(doctor);
      renderDoctors();
      e.target.reset();
    });

    function renderDoctors() {
      const list = document.getElementById('doctor-list');
      list.innerHTML = '';
      doctors.forEach(d => {
        list.innerHTML += `<div class='item'><span>${d.name} - ${d.specialty}</span></div>`;
      });
    }

    // Medicine CRUD
    document.getElementById('medicine-form').addEventListener('submit', e => {
      e.preventDefault();
      const name = document.getElementById('medicine-name').value;
      const dosage = document.getElementById('medicine-dosage').value;
      const medicine = { id: Date.now(), name, dosage };
      medicines.push(medicine);
      renderMedicines();
      e.target.reset();
    });

    function renderMedicines() {
      const list = document.getElementById('medicine-list');
      list.innerHTML = '';
      medicines.forEach(m => {
        list.innerHTML += `<div class='item'><span>${m.name} (${m.dosage})</span></div>`;
      });
    }
  </script>
</body>
</html>
