<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medical Management System</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
    }
    .app-container {
      width: 90%;
      max-width: 1000px;
      margin: auto;
      padding: 20px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    header { text-align: center; margin-bottom: 20px; }
    header h1 { color: #333; }
    .section { display: none; margin-bottom: 30px; }
    .section.active { display: block; }
    h2 { color: #444; margin-bottom: 10px; }
    form { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    input { padding: 10px; flex: 1; border: 1px solid #ccc; border-radius: 5px; }
    button { padding: 10px 15px; border: none; border-radius: 5px; background: #007bff; color: #fff; cursor: pointer; transition: background 0.3s; }
    button:hover { background: #0056b3; }
    #patient-list, #doctor-list, #medicine-list { border-top: 1px solid #ddd; padding-top: 10px; }
    .item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #eee; }
    .item span { flex: 1; }
    .item button { margin-left: 5px; }
    .item button.delete { background: #dc3545; }
    .item button.edit { background: #28a745; }
  </style>
</head>
<body>
  <div class="app-container">
    <header><h1>Medical Management System</h1></header>
    <main>
      <!-- Login -->
      <section id="login-section" class="section active">
        <h2>Login</h2>
        <form id="login-form">
          <input type="text" id="username" placeholder="Username" required>
          <input type="password" id="password" placeholder="Password" required>
          <button type="submit">Login</button>
        </form>
      </section>
      <!-- Patient -->
      <section id="patient-section" class="section">
        <h2>Register Patient</h2>
        <form id="patient-form">
          <input type="text" id="patient-name" placeholder="Full Name" required>
          <input type="number" id="patient-age" placeholder="Age" required>
          <input type="text" id="patient-gender" placeholder="Gender" required>
          <button type="submit">Register</button>
        </form>
        <div id="patient-list"></div>
      </section>
      <!-- Doctors -->
      <section id="doctor-section" class="section">
        <h2>Doctors</h2>
        <form id="doctor-form">
          <input type="text" id="doctor-name" placeholder="Doctor Name" required>
          <input type="text" id="doctor-specialty" placeholder="Specialty" required>
          <button type="submit">Add Doctor</button>
        </form>
        <div id="doctor-list"></div>
      </section>
      <!-- Medicines -->
      <section id="medicine-section" class="section">
        <h2>Medicines</h2>
        <form id="medicine-form">
          <input type="text" id="medicine-name" placeholder="Medicine Name" required>
          <input type="text" id="medicine-dosage" placeholder="Dosage" required>
          <button type="submit">Add Medicine</button>
        </form>
        <div id="medicine-list"></div>
      </section>
    </main>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const loginSection = document.getElementById("login-section");
      const patientSection = document.getElementById("patient-section");
      const doctorSection = document.getElementById("doctor-section");
      const medicineSection = document.getElementById("medicine-section");

      const loginForm = document.getElementById("login-form");
      const patientForm = document.getElementById("patient-form");
      const doctorForm = document.getElementById("doctor-form");
      const medicineForm = document.getElementById("medicine-form");

      const patientList = document.getElementById("patient-list");
      const doctorList = document.getElementById("doctor-list");
      const medicineList = document.getElementById("medicine-list");

      let patients = [], doctors = [], medicines = [];

      // Login
      loginForm.addEventListener("submit", e => {
        e.preventDefault();
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        if (username === "kelly" && password === "admin123") {
          alert("Login successful!");
          loginSection.classList.remove("active");
          patientSection.classList.add("active");
        } else alert("Invalid credentials!");
      });

      // Patients
      patientForm.addEventListener("submit", e => {
        e.preventDefault();
        const patient = { id: Date.now(), name: patientForm[0].value, age: patientForm[1].value, gender: patientForm[2].value };
        patients.push(patient);
        renderPatients();
        patientForm.reset();
      });
      function renderPatients(){
        patientList.innerHTML = "";
        patients.forEach(p => {
          patientList.innerHTML += `<div class="item"><span>${p.name} (${p.age}, ${p.gender})</span></div>`;
        });
      }

      // Doctors
      doctorForm.addEventListener("submit", e => {
        e.preventDefault();
        const doctor = { id: Date.now(), name: doctorForm[0].value, specialty: doctorForm[1].value };
        doctors.push(doctor);
        renderDoctors();
        doctorForm.reset();
      });

      function renderDoctors(){
        doctorList.innerHTML = "";
        doctors.forEach(d => {
          const div = document.createElement("div");
          div.classList.add("item");
          div.innerHTML = `
            <span>${d.name} - ${d.specialty}</span>
            <button class="edit">Edit</button>
            <button class="delete">Delete</button>
          `;
          div.querySelector(".delete").addEventListener("click", () => {
            doctors = doctors.filter(doc => doc.id !== d.id);
            renderDoctors();
          });
          div.querySelector(".edit").addEventListener("click", () => {
            const newName = prompt("Edit Doctor Name", d.name);
            const newSpecialty = prompt("Edit Specialty", d.specialty);
            if(newName && newSpecialty){
              d.name = newName;
              d.specialty = newSpecialty;
              renderDoctors();
            }
          });
          doctorList.appendChild(div);
        });
      }

      // Medicines
      medicineForm.addEventListener("submit", e => {
        e.preventDefault();
        const medicine = { id: Date.now(), name: medicineForm[0].value, dosage: medicineForm[1].value };
        medicines.push(medicine);
        renderMedicines();
        medicineForm.reset();
      });
      function renderMedicines(){
        medicineList.innerHTML = "";
        medicines.forEach(m => {
          medicineList.innerHTML += `<div class="item"><span>${m.name} (${m.dosage})</span></div>`;
        });
      }
    });
  </script>
</body>
</html>
