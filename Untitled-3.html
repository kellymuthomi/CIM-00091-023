<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Medical Management</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 0; }
    .dashboard { max-width: 1200px; margin: auto; padding: 20px; }
    header { text-align: center; margin-bottom: 20px; }
    .nav { display: flex; gap: 15px; margin-bottom: 20px; }
    .nav button { padding: 10px; border: none; border-radius: 5px; cursor: pointer; background: #6c757d; color: white; }
    .nav button.active { background: #007bff; }
    .section { display: none; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .section.active { display: block; }
    form { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    input { padding: 10px; border: 1px solid #ccc; border-radius: 5px; flex: 1; }
    button { padding: 10px 15px; border: none; border-radius: 5px; background: #007bff; color: white; cursor: pointer; }
    button:hover { background: #0056b3; }
    .item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
    .item span { flex: 1; }
    .item button { margin-left: 5px; }
    .item button.edit { background: #28a745; }
    .item button.delete { background: #dc3545; }
  </style>
</head>
<body>
  <div class="dashboard">
    <header>
      <h1>Admin Dashboard</h1>
      <p>Manage Patients, Doctors, and Medicines</p>
    </header>

    <div class="nav">
      <button id="nav-patients">Patients</button>
      <button id="nav-doctors">Doctors</button>
      <button id="nav-medicines">Medicines</button>
    </div>

    <!-- Patient Management -->
    <section id="patient-section" class="section active">
      <h2>Patients</h2>
      <form id="patient-form">
        <input type="text" id="patient-name" placeholder="Full Name" required>
        <input type="number" id="patient-age" placeholder="Age" required>
        <input type="text" id="patient-gender" placeholder="Gender" required>
        <button type="submit">Add Patient</button>
      </form>
      <div id="patient-list"></div>
    </section>

    <!-- Doctor Management -->
    <section id="doctor-section" class="section">
      <h2>Doctors</h2>
      <form id="doctor-form">
        <input type="text" id="doctor-name" placeholder="Doctor Name" required>
        <input type="text" id="doctor-specialty" placeholder="Specialty" required>
        <button type="submit">Add Doctor</button>
      </form>
      <div id="doctor-list"></div>
    </section>

    <!-- Medicine Management -->
    <section id="medicine-section" class="section">
      <h2>Medicines</h2>
      <form id="medicine-form">
        <input type="text" id="medicine-name" placeholder="Medicine Name" required>
        <input type="text" id="medicine-dosage" placeholder="Dosage" required>
        <button type="submit">Add Medicine</button>
      </form>
      <div id="medicine-list"></div>
    </section>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const navPatients = document.getElementById("nav-patients");
      const navDoctors = document.getElementById("nav-doctors");
      const navMedicines = document.getElementById("nav-medicines");

      const patientSection = document.getElementById("patient-section");
      const doctorSection = document.getElementById("doctor-section");
      const medicineSection = document.getElementById("medicine-section");

      function showSection(section, button) {
        [patientSection, doctorSection, medicineSection].forEach(s => s.classList.remove("active"));
        [navPatients, navDoctors, navMedicines].forEach(b => b.classList.remove("active"));
        section.classList.add("active");
        button.classList.add("active");
      }

      navPatients.addEventListener("click", () => showSection(patientSection, navPatients));
      navDoctors.addEventListener("click", () => showSection(doctorSection, navDoctors));
      navMedicines.addEventListener("click", () => showSection(medicineSection, navMedicines));

      let patients = [], doctors = [], medicines = [];

      // Patient CRUD
      const patientForm = document.getElementById("patient-form");
      const patientList = document.getElementById("patient-list");
      patientForm.addEventListener("submit", e => {
        e.preventDefault();
        const patient = { id: Date.now(), name: patientForm[0].value, age: patientForm[1].value, gender: patientForm[2].value };
        patients.push(patient);
        renderPatients();
        patientForm.reset();
      });
      function renderPatients() {
        patientList.innerHTML = "";
        patients.forEach(p => {
          const div = document.createElement("div");
          div.classList.add("item");
          div.innerHTML = `<span>${p.name} (${p.age}, ${p.gender})</span>
            <button class="edit">Edit</button>
            <button class="delete">Delete</button>`;
          div.querySelector(".delete").addEventListener("click", () => {
            patients = patients.filter(pt => pt.id !== p.id);
            renderPatients();
          });
          div.querySelector(".edit").addEventListener("click", () => {
            const newName = prompt("Edit Patient Name", p.name);
            const newAge = prompt("Edit Age", p.age);
            const newGender = prompt("Edit Gender", p.gender);
            if(newName && newAge && newGender){ p.name=newName; p.age=newAge; p.gender=newGender; renderPatients(); }
          });
          patientList.appendChild(div);
        });
      }

      // Doctor CRUD
      const doctorForm = document.getElementById("doctor-form");
      const doctorList = document.getElementById("doctor-list");
      doctorForm.addEventListener("submit", e => {
        e.preventDefault();
        const doctor = { id: Date.now(), name: doctorForm[0].value, specialty: doctorForm[1].value };
        doctors.push(doctor);
        renderDoctors();
        doctorForm.reset();
      });
      function renderDoctors() {
        doctorList.innerHTML = "";
        doctors.forEach(d => {
          const div = document.createElement("div");
          div.classList.add("item");
          div.innerHTML = `<span>${d.name} - ${d.specialty}</span>
            <button class="edit">Edit</button>
            <button class="delete">Delete</button>`;
          div.querySelector(".delete").addEventListener("click", () => {
            doctors = doctors.filter(doc => doc.id !== d.id);
            renderDoctors();
          });
          div.querySelector(".edit").addEventListener("click", () => {
            const newName = prompt("Edit Doctor Name", d.name);
            const newSpec = prompt("Edit Specialty", d.specialty);
            if(newName && newSpec){ d.name=newName; d.specialty=newSpec; renderDoctors(); }
          });
          doctorList.appendChild(div);
        });
      }

      // Medicine CRUD
      const medicineForm = document.getElementById("medicine-form");
      const medicineList = document.getElementById("medicine-list");
      medicineForm.addEventListener("submit", e => {
        e.preventDefault();
        const medicine = { id: Date.now(), name: medicineForm[0].value, dosage: medicineForm[1].value };
        medicines.push(medicine);
        renderMedicines();
        medicineForm.reset();
      });
      function renderMedicines() {
        medicineList.innerHTML = "";
        medicines.forEach(m => {
          const div = document.createElement("div");
          div.classList.add("item");
          div.innerHTML = `<span>${m.name} (${m.dosage})</span>
            <button class="edit">Edit</button>
            <button class="delete">Delete</button>`;
          div.querySelector(".delete").addEventListener("click", () => {
            medicines = medicines.filter(md => md.id !== m.id);
            renderMedicines();
          });
          div.querySelector(".edit").addEventListener("click", () => {
            const newName = prompt("Edit Medicine Name", m.name);
            const newDosage = prompt("Edit Dosage", m.dosage);
            if(newName && newDosage){ m.name=newName; m.dosage=newDosage; renderMedicines(); }
          });
          medicineList.appendChild(div);
        });
      }
    });
  </script>
</body>
</html>
